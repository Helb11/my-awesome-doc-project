name: ci
on:
  push:
    branches:
      - master
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - uses: actions/cache@v4
        with:
          key: ${{ github.ref }}
          path: .cache
      - run: pip install mkdocs-material
      - run: pip install mkdocs-glightbox # установка плагина glightbox для  mkdocs
      - run: pip install mkdocs-swagger-ui-tag #установка плагина для интеграции OpenApi через swagger
      - run: pip install mkdocs-redoc-tag #установка плагина для интеграции OpenApi через redoc
      - run: mkdocs gh-deploy --force
      